name: Verify and deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Check recommendation logic
        run: node --test
      - name: Check all record content integrity
        run: npm run content:check
      - name: Check static assets
        run: node scripts/check-site.mjs
      - name: Verify all candidate paths and three-reason coverage
        run: npm run audit:check
      - name: Require reviewed-only recommendations and explicit pending status
        run: npm run release:check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
